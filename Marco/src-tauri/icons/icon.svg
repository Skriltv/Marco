  <!-- Angular M mark, built as two folded chevrons -->
  <path
    d="M 30 90 L 30 40 L 47 40 L 64 66 L 81 40 L 98 40 L 98 90 L 84 90 L 84 60 L 68 84 L 60 84 L 44 60 L 44 90 Z"
    fill="#f4f4f5"
