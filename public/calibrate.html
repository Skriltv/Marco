<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8" />
<title>Calibrate</title>
<style>
  html, body {
    margin: 0; padding: 0; width: 100%; height: 100%;
    background: rgba(0, 0, 0, 0.001); /* effectively invisible but still clickable */
    cursor: crosshair;
    overflow: hidden;
    -webkit-user-select: none;
    user-select: none;
  }
  #hint {
    position: fixed;
    top: 20px; left: 50%;
    transform: translateX(-50%);
    font-family: -apple-system, Segoe UI, sans-serif;
    font-size: 13px;
    color: #fff;
    background: rgba(20, 20, 24, 0.9);
    border: 1px solid rgba(168, 85, 247, 0.5);
    padding: 8px 16px;
    border-radius: 8px;
    pointer-events: none;
    white-space: nowrap;
  }
</style>
</head>
<body>
  <div id="hint">Click the loadout position on screen — Esc to cancel</div>
  <div id="sel" style="position:fixed; display:none; border:1px solid #a855f7; background:rgba(168,85,247,0.15); pointer-events:none;"></div>
  <script>
    function whenTauriReady(cb) {
      if (window.__TAURI__) cb();
      else setTimeout(function () { whenTauriReady(cb); }, 20);
    }

    whenTauriReady(function () {
      var invoke = window.__TAURI__.core.invoke;
      var rectMode = new URLSearchParams(location.search).get("mode") === "rect";

      if (rectMode) {
        document.getElementById("hint").textContent =
          "Drag a rectangle over the weapon name area — Esc to cancel";
        var sel = document.getElementById("sel");
        var start = null;

        window.addEventListener("mousedown", function (e) {
          if (e.button !== 0) return;
          start = { cx: e.clientX, cy: e.clientY, sx: e.screenX, sy: e.screenY };
          sel.style.display = "block";
        });
        window.addEventListener("mousemove", function (e) {
          if (!start) return;
          sel.style.left = Math.min(start.cx, e.clientX) + "px";
          sel.style.top = Math.min(start.cy, e.clientY) + "px";
          sel.style.width = Math.abs(e.clientX - start.cx) + "px";
          sel.style.height = Math.abs(e.clientY - start.cy) + "px";
        });
        window.addEventListener("mouseup", function (e) {
          if (!start || e.button !== 0) return;
          var x = Math.round(Math.min(start.sx, e.screenX));
          var y = Math.round(Math.min(start.sy, e.screenY));
          var w = Math.round(Math.abs(e.screenX - start.sx));
          var h = Math.round(Math.abs(e.screenY - start.sy));
          start = null;
          if (w < 5 || h < 5) { sel.style.display = "none"; return; }
          invoke("report_calibration_rect", { x: x, y: y, w: w, h: h }).catch(function () {});
        });
      } else {
        window.addEventListener("mousedown", function (e) {
          if (e.button !== 0) return;
          var x = Math.round(e.screenX);
          var y = Math.round(e.screenY);
          invoke("report_calibration_click", { x: x, y: y }).catch(function () {});
        });
      }

      window.addEventListener("keydown", function (e) {
        if (e.key === "Escape") {
          invoke("cancel_calibration").catch(function () {});
        }
      });
    });
  </script>
</body>
</html>
